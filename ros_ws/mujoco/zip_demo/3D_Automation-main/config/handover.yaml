handover:
  ros__parameters:
    perception:
      confidence_min: 0.80
      stable_window_sec: 1.0
      linear_velocity_max_mps: 0.01
      depth_min_m: 0.20
      depth_max_m: 2.00
    object:
      initial_mass_kg: 0.20
      maximum_mass_kg: 0.30
      maximum_width_m: 0.07
    manipulation:
      maximum_velocity_scale: 0.20
      maximum_acceleration_scale: 0.15
      lift_height_m: 0.05
      require_base_stopped: true
      require_arm_stowed_before_base_motion: true
    grasp:
      minimum_width_m: 0.02
      maximum_width_m: 0.075
      width_tolerance_m: 0.005
      slip_translation_max_m: 0.005
      verification_window_sec: 1.0
    mobile_base:
      loaded_maximum_velocity_mps: 0.08
      loaded_maximum_angular_velocity_radps: 0.20
    safety:
      vision_retry_count: 1
      require_revalidation_after_stop: true
