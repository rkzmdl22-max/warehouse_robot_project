services:
  ros:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DISPLAY: ${DISPLAY:-host.docker.internal:0.0}
      LIBGL_ALWAYS_SOFTWARE: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-30}
    volumes:
      - .:/workspace/3D_Automation
    working_dir: /workspace/3D_Automation
    stdin_open: true
    tty: true
    command: bash

